<!DOCTYPE html>
<html>
<head>
    <title>Vortix Playground</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { color: #00ffcc; }
        .container { width: 80%; max-width: 800px; }
        textarea { width: 100%; height: 250px; background-color: #1e1e1e; color: #00ffcc; padding: 15px; font-family: monospace; font-size: 16px; border: 1px solid #333; border-radius: 5px; }
        button { margin-top: 15px; padding: 10px 25px; background-color: #00ffcc; color: #121212; font-weight: bold; font-size: 16px; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #00ccaa; }
        .output-box { margin-top: 20px; background-color: #000000; padding: 20px; border-radius: 5px; min-height: 100px; font-family: monospace; white-space: pre-wrap; border: 1px solid #333; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Vortix Live Editor</h1>
        <p>Write your code below and execute it directly from the browser.</p>
        
        <form method="POST">
            <textarea name="code" placeholder='beam("Hello from Vortix!")'>{{ code }}</textarea>
            <br>
            <button type="submit">▶ Run Code</button>
        </form>

        <h3>Terminal Output:</h3>
        <div class="output-box">{{ output }}</div>
    </div>
</body>
</html>
